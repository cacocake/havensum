<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Havensum · Android layout preview</title><style>*{box-sizing:border-box}body{margin:0;background:#eeede7;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif}.phone{width:calc(var(--phone-width,396px) + 18px);height:862px;border:9px solid #3a3d33;border-radius:37px;background:#faf9f6;overflow:hidden;box-shadow:0 22px 60px #3b3b3220}iframe{width:100%;height:100%;border:0;display:block}.label{position:fixed;left:35px;top:30px;color:#69705f;font-size:12px;line-height:1.8}.label select{display:block;margin-top:14px;background:#fff9f2;border:1px solid #dfd3de;border-radius:10px;padding:9px;color:#5f5368;font:inherit;min-width:160px}.label a{color:inherit;text-decoration:none;font-weight:600}@media(max-width:600px){body{background:#faf9f6}.phone{border:0;border-radius:0;width:100%;height:100dvh;box-shadow:none}.label{display:none}}@media(max-height:900px) and (min-width:600px){.phone{height:calc(100dvh - 38px)}} </style></head><body><div class="label"><a href="/">havensum</a><br>Android layout preview<br>Interactive example<select aria-label="Phone width"><option value="320">320 dp · compact phone</option><option value="360">360 dp · standard phone</option><option value="396" selected>396 dp · default preview</option><option value="412">412 dp · large phone</option></select></div><div class="phone"><iframe src="/?demo=1" title="Havensum mobile app"></iframe></div><script>document.querySelector("select").addEventListener("change",e=>document.documentElement.style.setProperty("--phone-width",e.target.value+"px"));</script></body></html>
